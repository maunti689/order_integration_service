name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orders_test
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orders:orders@localhost:5432/orders_test
      TEST_DATABASE_URL: postgresql+psycopg://orders:orders@localhost:5432/orders_test
      API_KEY_SALT: test-salt
      ADMIN_API_KEY: test-admin-key
      PROVIDER_WEBHOOK_SECRET: test-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base && alembic upgrade head
      - run: python -m scripts.seed_demo
      - run: pip wheel --no-deps --wheel-dir /tmp/wheels .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing
